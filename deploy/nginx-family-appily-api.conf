# Copy to /etc/nginx/sites-available/works-c-out-api on the VPS, symlink
# into sites-enabled, replace YOUR_DOMAIN_HERE, then run:
#   certbot --nginx -d YOUR_DOMAIN_HERE
# Follows the same pattern already working for the other apps on this box:
# container publishes to a loopback port, host nginx + certbot do the public
# routing and TLS (Traefik is not currently terminating traffic).
#
# This is a pure JSON API (no SPA to serve) — the native Swift app is the
# only client, so everything proxies straight through to Django/gunicorn.

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;

    location /static/ {
        alias /srv/docker/works-c-out-api/staticfiles/;
    }

    # Application PDFs live under media but carry her full contact details and
    # letters written for one employer. Filenames are guessable, so "unlisted"
    # is not private — they're served only through token-authenticated
    # /api/tracker/applications/<id>/download/<kind>/.
    location ^~ /media/applications/ {
        return 404;
    }

    location /media/ {
        alias /srv/docker/works-c-out-api/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generating application materials is one long model call; the 60s
        # default cuts it off and returns 504 while the work is still running.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
